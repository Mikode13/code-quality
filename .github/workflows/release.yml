name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Exact commit SHA on main to release. Before retrying a failed run, check npm
          for the calculated version, the matching v<version> Git tag, and the GitHub
          Release: these are not created atomically, and a published npm version can
          never be reused or overwritten.
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    name: audit production dependencies
    # Run the network-dependent advisory scan only for a release attempt. A failed audit
    # leaves the reusable publication job blocked by its needs relationship below.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' }}
        || (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository at the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}

      - name: Install pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          runtime: node@24
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run audit:prod
  release:
    name: release
    needs: audit
    # workflow_run fires for every CI completion, including pull request runs and
    # failures. Only a successful push run on main may reach the privileged reusable
    # workflow, which independently re-verifies all of this through the GitHub API
    # regardless of what this condition allows through.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main') }}
    # A reusable workflow's jobs can only maintain or reduce the caller's permissions,
    # never elevate them, so this grants the union of what the called workflow's two jobs
    # need: actions/checks read for the authorization gate that verifies CI / required,
    # and contents/id-token write for the tag, the GitHub Release, and npm Trusted
    # Publishing. Each called job narrows this further to only its own subset.
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    uses: Mikode13/.github/.github/workflows/release.yml@b9403230cf37a5ecdfc6a4d7b829f1c815e7e9ff
    with:
      sha: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
