allowBuilds:
  # Native binary resolution for eslint-import-resolver-typescript (via eslint-plugin-import-x).
  unrs-resolver: true
  # An inherited only-allow-pnpm guard from an older release; a consumer of this package has
  # no reason to run it.
  '@mikode13/tsconfig': false
minimumReleaseAgeExclude:
  - eslint@10.8.0
